name: Verify analyzer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run evaluate
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/true-cost-ocr-models
          key: tesseract-english-4.0.0
      - run: npm run evaluate:uploads
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          TRUE_COST_OCR_CACHE: ${{ runner.temp }}/true-cost-ocr-models
